<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Verification</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #troll-container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            z-index: 10;
        }

        .scan-title {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }

        #camera-box {
            width: 320px;
            height: 240px;
            border: 2px dashed #00ff00;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #051105;
            position: relative;
            box-shadow: 0 0 15px rgba(0,255,0,0.2);
        }

        #camera-box::before {
            content: "CAMERA INTERFACE";
            font-size: 12px;
            color: rgba(0,255,0,0.5);
        }

        #laser-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            top: 0;
            animation: scanMouvement 2s linear infinite;
            display: none;
        }

        @keyframes scanMouvement {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .progress-box {
            width: 100%;
            border: 2px solid #00ff00;
            padding: 5px;
            margin-top: 20px;
            box-shadow: 0 0 10px #00ff00;
            display: none;
        }

        #bar {
            width: 0%;
            background-color: #00ff00;
            height: 20px;
            transition: width 0.1s linear;
        }

        /* Scherm schudden en flitsen */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(12px, -12px) rotate(1deg); }
            50% { transform: translate(-12px, 12px) rotate(-1deg); }
            75% { transform: translate(12px, 12px) rotate(1deg); }
            100% { transform: translate(-12px, -12px) rotate(-1deg); }
        }

        @keyframes discoFlash {
            0% { background-color: #000000; }
            33% { background-color: #330000; }
            66% { background-color: #002200; }
            100% { background-color: #000000; }
        }

        .chaos-mode {
            animation: screenShake 0.15s infinite, discoFlash 0.3s infinite;
        }

        /* Wegspringende knop */
        #runaway-btn {
            position: fixed;
            padding: 15px 25px;
            background-color: #ff0000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            border: 3px solid #ffffff;
            cursor: pointer;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 20px #ff0000;
        }

        /* Ronddraaiende trollfaces */
        .flying-troll {
            position: fixed;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff00;
            pointer-events: none;
            z-index: 500;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Visuele error pop-ups */
        .fake-popup {
            position: fixed;
            background: #111;
            border: 2px solid #ff0000;
            color: #00ff00;
            padding: 15px;
            width: 260px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            z-index: 900;
            font-size: 13px;
            text-align: left;
            pointer-events: none;
        }
        .fake-popup-header {
            background: #ff0000;
            color: #000;
            font-weight: bold;
            padding: 3px 6px;
            margin: -15px -15px 10px -15px;
        }
    </style>
</head>
<body>

    <div id="troll-container">
        <div id="header-text" class="scan-title">🔐 AI USER VERIFICATION REQUIRED</div>
        <p id="status-text">> Please allow camera access or click anywhere to verify...</p>
        
        <div id="camera-box">
            <div id="laser-line"></div>
        </div>

        <div id="p-box" class="progress-box">
            <div id="bar"></div>
        </div>
    </div>

    <button id="runaway-btn">❌ STOP DE HACK ❌</button>

    <script>
        const statusText = document.getElementById('status-text');
        const headerText = document.getElementById('header-text');
        const bar = document.getElementById('bar');
        const progressBox = document.getElementById('p-box');
        const laserLine = document.getElementById('laser-line');
        const cameraBox = document.getElementById('camera-box');
        const runawayBtn = document.getElementById('runaway-btn');

        const logZinnen = [
            "Analyzing facial structure data...",
            "Matching biometric tokens against database...",
            "Downloading local homework folder...",
            "Uploading search history to Smartschool...",
            "YOU HAVE BEEN TROLLED! 🤣"
        ];

        let progress = 0;
        let zinIndex = 0;
        let trollTriggered = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTrollSound() {
            setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sawtooth';
                // Wisselt tussen lage en hoge tonen voor een sirene/laser-effect
                const startFreq = Math.random() > 0.5 ? 150 : 600;
                const endFreq = Math.random() > 0.5 ? 900 : 200;
                
                osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }, 160); 
        }

        // Laat de knop wegspringen als de muis in de buurt komt
        function moveButton() {
            const maxX = window.innerWidth - runawayBtn.offsetWidth - 20;
            const maxY = window.innerHeight - runawayBtn.offsetHeight - 20;
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));
            
            runawayBtn.style.left = randomX + 'px';
            runawayBtn.style.top = randomY + 'px';
        }

        runawayBtn.addEventListener('mouseover', moveButton);
        runawayBtn.addEventListener('touchstart', moveButton);
        runawayBtn.addEventListener('click', moveButton);

        function startChaos() {
            // Activeer scherm-schudden en flitsen
            document.body.classList.add('chaos-mode');

            // Toon de wegspringende knop in het midden
            runawayBtn.style.display = 'block';
            runawayBtn.style.left = (window.innerWidth / 2 - 100) + 'px';
            runawayBtn.style.top = (window.innerHeight / 2 + 80) + 'px';

            const waarschuwingen = [
                "Error 404: Brain not found.",
                "Your computer is laughing at you right now.",
                "Transferring 100 Robux to your teacher...",
                "Troll level: MAXIMUM.",
                "Access granted to your meme folder!",
                "Nice try pressing the red button!"
            ];

            // Spawn elke 200ms een nieuw error-venster of een draaiende trollface
            setInterval(() => {
                if (Math.random() > 0.4) {
                    const box = document.createElement('div');
                    box.className = 'fake-popup';
                    box.style.left = Math.random() * (window.innerWidth - 280) + 'px';
                    box.style.top = Math.random() * (window.innerHeight - 120) + 'px';
                    const msg = waarschuwingen[Math.floor(Math.random() * waarschuwingen.length)];
                    box.innerHTML = `<div class="fake-popup-header">⚠️ SYSTEM ERROR</div><div>${msg}</div>`;
                    document.body.appendChild(box);
                } else {
                    const troll = document.createElement('img');
                    troll.src = "https://wikimedia.org";
                    troll.className = 'flying-troll';
                    troll.style.left = Math.random() * (window.innerWidth - 120) + 'px';
                    troll.style.top = Math.random() * (window.innerHeight - 120) + 'px';
                    document.body.appendChild(troll);
                }
            }, 200);
        }

        function startTrollEffect() {
            if (trollTriggered) return;
            trollTriggered = true;
